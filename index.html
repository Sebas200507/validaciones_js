<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de estudiantes</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main>
        <h1>Registro de estudiantes</h1>
        <p>complete todos los campos parara realizar su Registro</p>

        <form action="" id="formulario">

            <div class="grupo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">
                <small id="errorNombre"></small>
            </div>
            <div class="grupo">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos">
                <small id="errorApellidos"></small>
            </div>
            <div class="grupo">
                <label for="documento">Documento:</label>
                <input type="text" id="documento">
                <small id="errorDocumento"></small>
            </div>
            <div class="grupo">
                <label for="correo">Correo Electronico:</label>
                <input type="text" id="correo">
                <small id="errorCorreo"></small>
            </div>
            <div class="grupo">
                <label for="telefono">Telefono:</label>
                <input type="text" id="telefono">
                <small id="errorTelefono"></small>
            </div>
            <div class="grupo">
                <label for="edad">Edad:</label>
                <input type="text" id="edad">
                <small id="errorEdad"></small>
            </div>
            <div class="grupo">
                <label for="contrasena">Contraseña:</label>
                <input type="text" id="contrasena">
                <small id="errorContrasena"></small>
            </div>
            <div class="grupo">
                <label for="confirmar">Confirmar:</label>
                <input type="text" id="confirmar">
                <small id="errorConfirmar"></small>
            </div>
            <div class="grupo">
                <label for="programa">Programa de formación:</label>
                <select id="programa">
                    <option value="">Seleccione un programa</option>
                    <option value="ADSO">Análisis y desarrollo de software</option>
                    <option value="Multimedia">Producción Multimedia</option>
                    <option value="Redes">Gestión de Redes</option>
                </select>
                <small id="errorPrograma"></small>
            </div>
            <div class="grupo terminos">
                <label>
                    <input type="checkbox" id="terminos">
                    Acepto los Términos y condiciones
                </label>
                <small id="errorTerminos"></small>
            </div>

            <button type="submit" id="btnRegistrar">
                Registrar estudiante
            </button>

            <p id="mensajeFinal"></p>

        </form>
    </main>

    <script src="JS/validaciones.js"></script>
</body>
</html>
